<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081018">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BILYARD CLUB"><title>Sozlamalar</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><h1>{{club_name}}</h1><nav><a href="/">Bosh sahifa</a><a href="/reports">Hisobot</a><a href="/settings">Sozlamalar</a></nav></header><main><h2>⚙ SOZLAMALAR</h2><section class="panel"><h3>Klub nomi</h3><form method="post"><input type="hidden" name="action" value="club"><input name="club_name" value="{{club_name}}"><button>Saqlash</button></form></section><section class="panel"><h3>Stol narxlari</h3>{% for t in tables %}<form method="post" class="inline"><input type="hidden" name="action" value="price"><input type="hidden" name="table_id" value="{{t.id}}"><b>{{t.kind}} {{t.number}}</b><input name="price" type="number" value="{{t.price}}" step="1000"><button>Saqlash</button></form>{% endfor %}</section><section class="panel"><h3>Mahsulot qo'shish</h3><form method="post" class="inline"><input type="hidden" name="action" value="product"><input name="name" placeholder="Nomi" required><input name="category" placeholder="Kategoriya" value="Gazak" required><input name="size" placeholder="Hajmi"><input name="price" type="number" placeholder="Sotuv narxi" required><input name="cost" type="number" placeholder="Tannarxi" value="0"><button>Qo'shish</button></form></section><section class="panel"><h3>Mahsulot narxlari</h3>{% for p in products %}<form method="post" class="inline"><input type="hidden" name="action" value="product_price"><input type="hidden" name="product_id" value="{{p.id}}"><b>{{p.name}} {{p.size}}</b><input name="price" type="number" value="{{p.price}}"><input name="cost" type="number" value="{{p.cost}}"><button>Saqlash</button></form>{% endfor %}</section></main><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
</body></html>
